plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jeevitesh.billing'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jeevitesh.billing'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // One fixed key for every build, so a new APK installs over the old one and keeps working.
    // (It is the standard public "debug" key, fine for a private tool, not for the Play Store.)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Self-contained barcode scanner (ZXing). Works offline, needs no Google Play services.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
