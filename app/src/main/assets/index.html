<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Stock &amp; Bill</title>
<style>
:root{--bg:#0b0d10;--card:#14181f;--card2:#1a1f28;--line:rgba(255,255,255,.09);--txt:#f1f3f6;--mut:#9aa3b2;--acc:#22c55e;--acc2:#16a34a;--bad:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#0e1116}
header h1{font-size:18px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.dot.off{background:var(--bad);box-shadow:0 0 10px var(--bad)}
main{flex:1;overflow-y:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:#0e1116;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--mut);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav button b{font-size:21px;line-height:1.1}
nav button.on{color:var(--acc)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.big{width:100%;min-height:62px;border:0;border-radius:16px;background:linear-gradient(180deg,#2ad66b,#16a34a);color:#04130a;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(34,197,94,.25)}
.big:active{transform:scale(.99)}
.btn{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--acc);color:#04130a;font-weight:800;cursor:pointer;flex:1}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:#3a1015;color:#ff9aa2;border:1px solid #6b1a22}
.btn:disabled{opacity:.45}
.typed{display:flex;gap:8px;margin:10px 0 12px}
.typed input,.field input,.field select,.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}
.typed input:focus,.field input:focus,.search:focus{border-color:var(--acc)}
.typed button{min-width:80px;border:0;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:14px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.empty{color:var(--mut);text-align:center;padding:26px 8px;font-size:15px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .n{font-weight:700;line-height:1.25}
.line .s{color:var(--mut);font-size:13px}
.line .amt{font-weight:800;text-align:right}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.step button{width:40px;height:36px;border:0;background:var(--card2);font-size:20px;cursor:pointer}
.step span{min-width:38px;text-align:center;font-weight:800}
.rm{background:none;border:0;color:#ff8d96;font-size:13px;margin-left:10px;cursor:pointer}
.tot{display:flex;justify-content:space-between;padding:5px 0;color:#cdd3dd}
.tot.g{font-size:22px;font-weight:900;color:#fff;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.disc{display:flex;align-items:center;gap:10px;margin:8px 0}
.disc input{width:110px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:right}
.prow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:0}
.prow .i{flex:1;min-width:0}
.prow .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .s{color:var(--mut);font-size:13px}
.qty{font-size:22px;font-weight:900;min-width:44px;text-align:right}
.qty.low{color:var(--bad)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:800;background:#3a1015;color:#ff9aa2;margin-left:6px}
.pill.warn{background:#3a2a07;color:#fcd34d}
.banner{display:flex;align-items:center;gap:10px;background:#3a1015;border:1px solid #6b1a22;color:#ffc9ce;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700;cursor:pointer}
.ok{background:#0d2a19;border:1px solid #1d5a35;color:#a7f3c3;border-radius:14px;padding:14px;text-align:center;font-weight:700}
.muted{color:var(--mut);font-size:14px}
.bad{color:var(--bad)}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--mut);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:24px;height:24px;accent-color:var(--acc)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:#10141a;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:20px;margin-bottom:10px}
.pname{font-size:19px;font-weight:800;margin-bottom:4px}
pre.rc{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;background:#0b0d10;border:1px dashed var(--line);border-radius:12px;padding:12px;margin:8px 0 12px;line-height:1.5}
.lowbox{background:#3a1015;border:1px solid #6b1a22;border-radius:12px;padding:10px 12px;margin:8px 0 12px}
.lowbox .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;color:#ffc9ce}
.lowbox button{border:0;background:#ef4444;color:#fff;font-weight:800;border-radius:9px;padding:7px 12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,16px);background:#1c2029;border:1px solid var(--acc);padding:11px 16px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:.22s;max-width:92%;text-align:center;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--bad)}
.full{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;justify-content:center;padding:28px;gap:14px;text-align:center}
.full h2{font-size:26px}
.full p{color:var(--mut);line-height:1.5}
.demo{background:#3a2a05;color:#ffd77a;text-align:center;font-size:12.5px;padding:5px 8px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic{display:inline-flex;width:22px;height:22px;margin-right:10px;vertical-align:-4px}.ic svg{width:100%;height:100%}
.big{display:flex;align-items:center;justify-content:center}
.banner .ic{margin-right:0;flex:none}.ok .ic{margin-right:4px;vertical-align:-5px}
nav button b{display:block;width:24px;height:24px}nav button b svg{width:100%;height:100%}
</style>
</head>
<body>
<div id="demo" class="demo" style="display:none">Browser demo mode: data is kept in this browser only. In the app it is saved in your chosen folder.</div>
<header><span class="dot" id="dot"></span><h1 id="title">Stock &amp; Bill</h1></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>
<div id="full" class="full" style="display:none"></div>

<script>
(function () {
'use strict';
var A = window.Android || null;
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var fmt = function (n) { return '₹' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-IN'); };
var when = function (ts) { try { return new Date(ts).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return new Date(ts).toString(); } };
var sameDay = function (a, b) { var x = new Date(a), y = new Date(b); return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate(); };

var IC = {
  scan: '<svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10"/></svg>',
  sell: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>',
  stock: '<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></svg>',
  alert: '<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18v.01"/></svg>',
  bills: '<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/></svg>',
  settings: '<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
function ic(n) { return '<span class="ic">' + IC[n] + '</span>'; }

var S = { tab: 'sell', db: { shop: 'My Shop', low: 5, autoAdd: false, products: [] }, sales: [], bill: [], discount: 0, q: '', folder: '', err: '' };

/* ---------------- storage: JSON files in the folder (or the browser in demo mode) ---------------- */
var IO = {
  read: function (name) { if (A) return A.readFile(name); try { return localStorage.getItem('sb_' + name) || ''; } catch (e) { return ''; } },
  write: function (name, text) { if (A) return A.writeFile(name, text); try { localStorage.setItem('sb_' + name, text); return 'ok'; } catch (e) { return 'ERR:' + e.message; } }
};
function parseFile(name) {
  var t = IO.read(name);
  if (t.indexOf('ERR:') === 0) throw new Error(t.slice(4));
  if (!t.trim()) return null;
  return JSON.parse(t);
}
function loadAll() {
  S.err = '';
  try {
    var d;
    try { d = parseFile('stock.json'); }
    catch (e) { if (e instanceof SyntaxError) { d = parseFile('stock.bak.json'); if (!d) throw e; toast('Main stock file was damaged. Restored from backup.', true); } else throw e; }
    if (d && Array.isArray(d.products)) S.db = Object.assign({ shop: 'My Shop', low: 5, autoAdd: false }, d);
    var s;
    try { s = parseFile('sales.json'); }
    catch (e2) { if (e2 instanceof SyntaxError) s = parseFile('sales.bak.json'); else throw e2; }
    S.sales = Array.isArray(s) ? s : [];
  } catch (e3) { S.err = e3.message; }
}
function saveDb() {
  var t = JSON.stringify(S.db), r = IO.write('stock.json', t);
  if (r !== 'ok') { toast('Could not save: ' + r.replace('ERR:', ''), true); return false; }
  IO.write('stock.bak.json', t);
  return true;
}
function saveSales() {
  var t = JSON.stringify(S.sales), r = IO.write('sales.json', t);
  if (r !== 'ok') { toast('Could not save bill history: ' + r.replace('ERR:', ''), true); return false; }
  IO.write('sales.bak.json', t);
  return true;
}

/* ---------------- helpers ---------------- */
var toastT;
function toast(m, bad) { var t = $('#toast'); t.textContent = m; t.className = 'show' + (bad ? ' err' : ''); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2600); }
function buzz() { try { if (navigator.vibrate) navigator.vibrate([160, 80, 160]); } catch (e) {} }
function findP(code) { for (var i = 0; i < S.db.products.length; i++) if (S.db.products[i].barcode === code) return S.db.products[i]; return null; }
function limitOf(p) { return (p.low != null && p.low !== '') ? Number(p.low) : Number(S.db.low); }
function isLow(p) { return p.qty <= limitOf(p); }
function lowList() { return S.db.products.filter(isLow).sort(function (a, b) { return a.qty - b.qty; }); }
function billQty(code) { var l = S.bill.filter(function (x) { return x.code === code; })[0]; return l ? l.qty : 0; }
function modal(html, mount) { $('#toast').classList.remove('show'); var m = $('#modal'); m.innerHTML = '<div class="sheet">' + html + '</div>'; m.classList.add('open'); if (mount) mount(m); }
function closeModal() { var m = $('#modal'); m.classList.remove('open'); m.innerHTML = ''; }
function num(id) { var v = $(id); return v ? Number(v.value) : NaN; }

/* ---------------- scanning ---------------- */
var scanning = false;
function scanOnce() {
  return new Promise(function (resolve, reject) {
    if (A) {
      window.onNativeScan = function (v) { resolve(v); };
      window.onNativeScanCancel = function () { resolve(null); };
      window.onNativeScanError = function (m) { reject(new Error(m)); };
      A.scan();
    } else { var v = window.prompt('Demo mode: type a barcode'); resolve(v ? v.trim() : null); }
  });
}
function doScan(handler) {
  if (scanning) return;
  scanning = true;
  scanOnce().then(function (v) { scanning = false; if (v) handler(String(v).trim()); })
    .catch(function (e) { scanning = false; toast('Scanner problem: ' + e.message + '. You can type the code instead.', true); });
}

/* ---------------- SELL ---------------- */
function handleSellCode(code) {
  if (!code) return;
  var p = findP(code);
  if (!p) {
    modal('<h3>Not in stock list</h3><p class="muted">No product with barcode <b>' + esc(code) + '</b>. Add it first, then sell it.</p><div class="btns" style="margin-top:14px"><button class="btn" data-act="new-from-sell" data-code="' + esc(code) + '">Add this product</button><button class="btn ghost" data-act="close">Close</button></div>');
    return;
  }
  if (p.qty <= 0) { buzz(); modal('<h3>Out of stock</h3><div class="pname">' + esc(p.name) + '</div><p class="muted">0 left. Add stock before selling.</p><div class="btns" style="margin-top:14px"><button class="btn" data-act="addstock" data-code="' + esc(p.barcode) + '">Add stock</button><button class="btn ghost" data-act="close">Close</button></div>'); return; }
  if (S.db.autoAdd) { if (addToBill(p, 1)) setTimeout(function () { doScan(handleSellCode); }, 250); return; }
  sellQtyModal(p);
}
function sellQtyModal(p) {
  var left = p.qty - billQty(p.barcode);
  modal('<h3>Sell</h3><div class="pname">' + esc(p.name) + '</div><div class="muted">' + fmt(p.price) + ' each · in stock: <b class="' + (isLow(p) ? 'bad' : '') + '">' + p.qty + '</b>' + (billQty(p.barcode) ? ' · already on bill: ' + billQty(p.barcode) : '') + '</div>' +
    (isLow(p) ? '<div class="lowbox"><div class="r">Low stock: only ' + p.qty + ' left</div></div>' : '') +
    '<div class="field" style="margin-top:12px"><label>How many?</label><input id="fSell" type="number" inputmode="numeric" min="1" step="1" value="1"></div>' +
    '<div class="btns"><button class="btn" data-act="do-sell" data-code="' + esc(p.barcode) + '">Add to bill</button><button class="btn ghost" data-act="do-sell-next" data-code="' + esc(p.barcode) + '">Add &amp; scan next</button></div><div class="btns"><button class="btn ghost" data-act="close">Cancel</button></div>',
    function () { var i = $('#fSell'); i.focus(); i.select(); });
  if (left <= 0) toast('All ' + p.qty + ' already on the bill', true);
}
function addToBill(p, n) {
  var have = billQty(p.barcode);
  if (have + n > p.qty) { buzz(); toast('Only ' + p.qty + ' of ' + p.name + ' in stock', true); return false; }
  var l = S.bill.filter(function (x) { return x.code === p.barcode; })[0];
  if (l) l.qty += n; else S.bill.push({ code: p.barcode, qty: n });
  render(); toast('Added: ' + p.name + ' × ' + n);
  return true;
}
function billTotals() {
  var sub = 0;
  S.bill.forEach(function (l) { var p = findP(l.code); if (p) sub += p.price * l.qty; });
  var d = Math.min(sub, Math.max(0, Number(S.discount) || 0));
  return { sub: sub, disc: d, total: sub - d };
}
function updateTotals() { var t = billTotals(), el = $('#totals'); if (el) el.innerHTML = totalsHTML(t); var b = $('#complete'); if (b) b.disabled = !S.bill.length; }
function totalsHTML(t) { return '<div class="tot"><span>Subtotal</span><span>' + fmt(t.sub) + '</span></div>' + (t.disc ? '<div class="tot"><span>Discount</span><span>− ' + fmt(t.disc) + '</span></div>' : '') + '<div class="tot g"><span>Total</span><span>' + fmt(t.total) + '</span></div>'; }
function completeBill() {
  if (!S.bill.length) return;
  var i, l, p;
  for (i = 0; i < S.bill.length; i++) {
    l = S.bill[i]; p = findP(l.code);
    if (!p) { toast('A product on the bill was removed from stock', true); return; }
    if (l.qty > p.qty) { toast('Only ' + p.qty + ' of ' + p.name + ' in stock', true); return; }
  }
  var snapshot = JSON.parse(JSON.stringify(S.db.products)), lines = [];
  S.bill.forEach(function (x) { var q = findP(x.code); q.qty -= x.qty; lines.push({ barcode: q.barcode, name: q.name, price: q.price, qty: x.qty }); });
  var sub = lines.reduce(function (a, x) { return a + x.price * x.qty; }, 0);
  var disc = Math.min(sub, Math.max(0, Number(S.discount) || 0));
  var sale = { id: 'B' + Date.now().toString(36).toUpperCase().slice(-6), ts: Date.now(), items: lines, subtotal: sub, discount: disc, total: sub - disc };
  S.sales.push(sale);
  if (!saveDb()) { S.db.products = snapshot; S.sales.pop(); render(); return; }
  saveSales();
  var low = lines.map(function (x) { return findP(x.barcode); }).filter(function (q) { return q && isLow(q); });
  S.bill = []; S.discount = 0;
  render();
  if (low.length) buzz();
  showReceipt(sale, low);
}
function receiptText(s) {
  var t = S.db.shop + '\n' + when(s.ts) + '\nBill ' + s.id + '\n--------------------------\n';
  s.items.forEach(function (x, i) { t += (i + 1) + '. ' + x.name + '\n    ' + x.qty + ' × ' + fmt(x.price) + ' = ' + fmt(x.qty * x.price) + '\n'; });
  t += '--------------------------\n';
  if (s.discount) t += 'Subtotal: ' + fmt(s.subtotal) + '\nDiscount: -' + fmt(s.discount) + '\n';
  return t + 'TOTAL: ' + fmt(s.total) + '\nThank you!';
}
function showReceipt(s, low) {
  var lowHTML = '';
  if (low && low.length) lowHTML = '<div class="lowbox"><b style="color:#ff9aa2">Running low</b>' + low.map(function (p) { return '<div class="r"><span>' + esc(p.name) + ': <b>' + p.qty + ' left</b></span><button data-act="addstock" data-code="' + esc(p.barcode) + '">Add stock</button></div>'; }).join('') + '</div>';
  modal('<h3>Bill saved</h3>' + lowHTML + '<pre class="rc">' + esc(receiptText(s)) + '</pre><div class="btns"><button class="btn" data-act="share" data-id="' + esc(s.id) + '">Share bill</button><button class="btn ghost" data-act="close">Done</button></div>');
}

/* ---------------- STOCK ---------------- */
function handleStockCode(code) {
  if (!code) return;
  var p = findP(code);
  if (p) addStockModal(p); else productForm(code, null);
}
function addStockModal(p) {
  modal('<h3>Add stock</h3><div class="pname">' + esc(p.name) + '</div><div class="muted">In stock now: <b class="' + (isLow(p) ? 'bad' : '') + '">' + p.qty + '</b> · ' + fmt(p.price) + '</div>' +
    '<div class="field" style="margin-top:12px"><label>Quantity to add</label><input id="fAdd" type="number" inputmode="numeric" min="1" step="1" value="1"></div>' +
    '<div class="btns"><button class="btn" data-act="do-addstock" data-code="' + esc(p.barcode) + '">Add to stock</button><button class="btn ghost" data-act="do-addstock-next" data-code="' + esc(p.barcode) + '">Add &amp; scan next</button></div>' +
    '<div class="btns"><button class="btn ghost" data-act="edit-product" data-code="' + esc(p.barcode) + '">Edit product</button><button class="btn ghost" data-act="close">Cancel</button></div>',
    function () { var i = $('#fAdd'); i.focus(); i.select(); });
}
function productForm(code, p) {
  var isNew = !p;
  modal('<h3>' + (isNew ? 'New product' : 'Edit product') + '</h3>' +
    '<div class="field"><label>Barcode</label><input id="fCode" value="' + esc(p ? p.barcode : code || '') + '"' + (p ? ' readonly' : '') + '></div>' +
    '<div class="field"><label>Name *</label><input id="fName" value="' + esc(p ? p.name : '') + '" placeholder="e.g. Whey Protein 2 kg"></div>' +
    '<div class="row2"><div class="field"><label>Selling price (₹) *</label><input id="fPrice" type="number" inputmode="decimal" min="0" step="any" value="' + (p ? p.price : '') + '"></div>' +
    '<div class="field"><label>' + (isNew ? 'Quantity in stock' : 'Stock count') + '</label><input id="fQty" type="number" inputmode="numeric" min="0" step="1" value="' + (p ? p.qty : 1) + '"></div></div>' +
    '<div class="field"><label>Alert when stock is at or below (empty = default ' + S.db.low + ')</label><input id="fLow" type="number" inputmode="numeric" min="0" step="1" value="' + (p && p.low != null ? p.low : '') + '"></div>' +
    '<div class="btns"><button class="btn" data-act="save-product" data-new="' + (isNew ? 1 : 0) + '">Save</button>' + (isNew ? '' : '<button class="btn danger" data-act="del-product" data-code="' + esc(p.barcode) + '">Delete</button>') + '<button class="btn ghost" data-act="close">Cancel</button></div>',
    function () { var i = $(isNew && code ? '#fName' : (isNew ? '#fCode' : '#fName')); if (i) i.focus(); });
}
function saveProduct(isNew) {
  var code = $('#fCode').value.trim(), name = $('#fName').value.trim(), price = num('#fPrice'), qty = num('#fQty'), lowRaw = $('#fLow').value.trim();
  if (!code) return toast('Enter the barcode', true);
  if (!name) return toast('Enter the product name', true);
  if (!(price >= 0)) return toast('Enter the selling price', true);
  if (!(qty >= 0) || Math.floor(qty) !== qty) return toast('Quantity must be a whole number', true);
  var low = lowRaw === '' ? null : Math.floor(Number(lowRaw));
  if (low !== null && !(low >= 0)) return toast('Alert limit must be 0 or more', true);
  var snap = JSON.parse(JSON.stringify(S.db.products));
  if (isNew) {
    if (findP(code)) return toast('This barcode is already in the stock list', true);
    S.db.products.push({ barcode: code, name: name, price: price, qty: qty, low: low });
  } else {
    var p = findP(code); if (!p) return;
    p.name = name; p.price = price; p.qty = qty; p.low = low;
  }
  if (!saveDb()) { S.db.products = snap; return; }
  closeModal(); render(); toast((isNew ? 'Added: ' : 'Saved: ') + name);
  var q = findP(code); if (q && isLow(q)) { buzz(); }
}

/* ---------------- VIEWS ---------------- */
function lowBanner() {
  var n = lowList().length;
  return n ? '<div class="banner" data-act="tab" data-tab="alerts">' + ic("alert") + '<span>' + n + ' product' + (n > 1 ? 's' : '') + ' low or out of stock. Tap to see.</span></div>' : '';
}
function sellView() {
  var rows = S.bill.map(function (l) {
    var p = findP(l.code); if (!p) return '';
    return '<div class="line"><div><div class="n">' + esc(p.name) + '</div><div class="s">' + fmt(p.price) + ' each · ' + p.qty + ' in stock</div>' +
      '<div class="step"><button data-act="bill-dec" data-code="' + esc(l.code) + '">−</button><span>' + l.qty + '</span><button data-act="bill-inc" data-code="' + esc(l.code) + '">+</button></div><button class="rm" data-act="bill-rm" data-code="' + esc(l.code) + '">Remove</button></div><div class="amt">' + fmt(p.price * l.qty) + '</div></div>';
  }).join('');
  return '<button class="big" data-act="scan-sell">'+ic("scan")+'Scan item to sell</button>' +
    '<form class="typed" data-form="sell-code"><input id="codeSell" placeholder="or type / scan a code" autocomplete="off"><button>Add</button></form>' + lowBanner() +
    '<div class="card"><h2>Current bill</h2>' + (rows || '<div class="empty">No items yet. Scan the first product.</div>') + '</div>' +
    (S.bill.length ? '<div class="card"><div class="disc"><span class="muted" style="flex:1">Discount (₹)</span><input id="discount" type="number" inputmode="decimal" min="0" step="any" value="' + (S.discount || '') + '" placeholder="0"></div><div id="totals">' + totalsHTML(billTotals()) + '</div></div>' : '') +
    '<div class="btns"><button class="btn" id="complete" data-act="complete" ' + (S.bill.length ? '' : 'disabled') + ' style="min-height:56px;font-size:17px">Complete bill</button>' + (S.bill.length ? '<button class="btn ghost" data-act="clear-bill" style="flex:0 0 auto">Clear</button>' : '') + '</div>';
}
function stockRows() {
  var q = S.q.trim().toLowerCase();
  var list = S.db.products.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) >= 0 || p.barcode.toLowerCase().indexOf(q) >= 0; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  if (!list.length) return '<div class="empty">' + (S.db.products.length ? 'No match.' : 'No products yet. Scan a barcode to add the first one.') + '</div>';
  return list.map(function (p) {
    return '<div class="prow" data-act="addstock" data-code="' + esc(p.barcode) + '"><div class="i"><div class="n">' + esc(p.name) + (p.qty <= 0 ? '<span class="pill">OUT</span>' : (isLow(p) ? '<span class="pill warn">LOW</span>' : '')) + '</div><div class="s">' + esc(p.barcode) + ' · ' + fmt(p.price) + '</div></div><div class="qty ' + (isLow(p) ? 'low' : '') + '">' + p.qty + '</div></div>';
  }).join('');
}
function stockView() {
  var units = S.db.products.reduce(function (a, p) { return a + p.qty; }, 0);
  return '<button class="big" data-act="scan-stock">'+ic("scan")+'Scan to add stock</button>' +
    '<form class="typed" data-form="stock-code"><input id="codeStock" placeholder="or type / scan a code" autocomplete="off"><button>Add</button></form>' +
    '<div class="stat"><div><span class="muted">Products</span><b>' + S.db.products.length + '</b></div><div><span class="muted">Units in stock</span><b>' + units + '</b></div></div>' +
    '<input class="search" id="search" placeholder="Search name or barcode" value="' + esc(S.q) + '" style="margin-bottom:10px"><div class="card" id="stockList">' + stockRows() + '</div>';
}
function alertsView() {
  var l = lowList();
  if (!l.length) return '<div class="ok">' + ic('check') + ' All good. No product is at or below its alert limit.</div>';
  return '<div class="card"><h2>Add stock for these</h2>' + l.map(function (p) {
    return '<div class="prow" data-act="addstock" data-code="' + esc(p.barcode) + '"><div class="i"><div class="n">' + esc(p.name) + (p.qty <= 0 ? '<span class="pill">OUT</span>' : '') + '</div><div class="s">alert at ' + limitOf(p) + ' or less · ' + esc(p.barcode) + '</div></div><div class="qty low">' + p.qty + '</div></div>';
  }).join('') + '</div><button class="big" data-act="scan-stock">'+ic("scan")+'Scan to add stock</button>';
}
function billsView() {
  var today = S.sales.filter(function (s) { return sameDay(s.ts, Date.now()); });
  var tt = today.reduce(function (a, s) { return a + s.total; }, 0);
  var list = S.sales.slice().reverse().slice(0, 100);
  return '<div class="stat"><div><span class="muted">Today\'s bills</span><b>' + today.length + '</b></div><div><span class="muted">Today\'s sales</span><b>' + fmt(tt) + '</b></div></div>' +
    '<div class="card"><h2>Recent bills</h2>' + (list.length ? list.map(function (s) {
      return '<div class="prow" data-act="open-bill" data-id="' + esc(s.id) + '"><div class="i"><div class="n">' + esc(s.id) + ' · ' + s.items.length + ' item' + (s.items.length > 1 ? 's' : '') + '</div><div class="s">' + when(s.ts) + '</div></div><div class="qty" style="font-size:18px">' + fmt(s.total) + '</div></div>';
    }).join('') : '<div class="empty">No bills yet.</div>') + '</div>' +
    '<div class="btns"><button class="btn ghost" data-act="export">Save sales.csv + stock.csv in folder</button></div>';
}
function settingsView() {
  return '<div class="card"><h2>Shop</h2><div class="field"><label>Shop name (printed on bills)</label><input id="sShop" value="' + esc(S.db.shop) + '"></div>' +
    '<div class="field"><label>Default low-stock alert (at or below)</label><input id="sLow" type="number" inputmode="numeric" min="0" step="1" value="' + S.db.low + '"></div>' +
    '<label class="switch"><span>Fast selling: each scan adds 1 item and opens the scanner again</span><input type="checkbox" id="sAuto" ' + (S.db.autoAdd ? 'checked' : '') + '></label>' +
    '<div class="btns"><button class="btn" data-act="save-settings">Save settings</button></div></div>' +
    '<div class="card"><h2>Data folder</h2><p class="muted" style="margin-bottom:10px">' + (A ? 'Saved in: <b>' + esc(S.folder || '?') + '</b><br>Files: stock.json, sales.json (+ backups). Keep this folder; you can copy it to another phone.' : 'Browser demo mode (no folder).') + '</p>' +
    '<div class="btns">' + (A ? '<button class="btn ghost" data-act="change-folder">Choose another folder</button>' : '') + '<button class="btn ghost" data-act="reload">Reload from folder</button></div></div>' +
    '<p class="muted" style="text-align:center;margin-top:8px">Stock &amp; Bill 1.0 · works offline · no account, no database</p>';
}
var VIEWS = { sell: sellView, stock: stockView, alerts: alertsView, bills: billsView, settings: settingsView };
var TABS = [['sell', 'sell', 'Sell'], ['stock', 'stock', 'Stock'], ['alerts', 'alert', 'Alerts'], ['bills', 'bills', 'Bills'], ['settings', 'settings', 'Settings']];
function render() {
  $('#title').textContent = S.db.shop || 'Stock & Bill';
  $('#view').innerHTML = VIEWS[S.tab]();
  var n = lowList().length;
  $('#nav').innerHTML = TABS.map(function (t) { return '<button class="' + (S.tab === t[0] ? 'on' : '') + '" data-act="tab" data-tab="' + t[0] + '"><b>' + IC[t[1]] + '</b>' + t[2] + (t[0] === 'alerts' && n ? '<span class="badge">' + n + '</span>' : '') + '</button>'; }).join('');
}

/* ---------------- exports ---------------- */
function csvCell(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCsv() {
  var s = 'bill,date,barcode,name,price,qty,amount,bill_discount,bill_total\n';
  S.sales.forEach(function (b) { b.items.forEach(function (x) { s += [b.id, new Date(b.ts).toISOString(), x.barcode, x.name, x.price, x.qty, x.price * x.qty, b.discount, b.total].map(csvCell).join(',') + '\n'; }); });
  var t = 'barcode,name,price,qty,alert_at\n';
  S.db.products.forEach(function (p) { t += [p.barcode, p.name, p.price, p.qty, limitOf(p)].map(csvCell).join(',') + '\n'; });
  var r1 = IO.write('sales.csv', '﻿' + s), r2 = IO.write('stock.csv', '﻿' + t);
  toast(r1 === 'ok' && r2 === 'ok' ? 'Saved sales.csv and stock.csv in your folder' : 'Could not save the CSV files', !(r1 === 'ok' && r2 === 'ok'));
}
function shareText(text) {
  if (A) { A.share(text); return; }
  if (navigator.share) { navigator.share({ text: text }).catch(function () {}); return; }
  try { navigator.clipboard.writeText(text); toast('Copied'); } catch (e) { toast('Sharing is not available here', true); }
}

/* ---------------- events ---------------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) { if (e.target.id === 'modal') closeModal(); return; }
  var a = t.dataset.act, code = t.dataset.code, p;
  switch (a) {
    case 'tab': S.tab = t.dataset.tab; closeModal(); render(); break;
    case 'close': closeModal(); break;
    case 'scan-sell': doScan(handleSellCode); break;
    case 'scan-stock': closeModal(); doScan(handleStockCode); break;
    case 'new-from-sell': closeModal(); productForm(code, null); break;
    case 'do-sell': case 'do-sell-next': {
      p = findP(code); if (!p) return;
      var n = Math.floor(num('#fSell'));
      if (!(n >= 1)) return toast('Enter how many', true);
      if (addToBill(p, n)) { closeModal(); if (a === 'do-sell-next') setTimeout(function () { doScan(handleSellCode); }, 250); }
      break; }
    case 'bill-inc': p = findP(code); if (p) { var l = S.bill.filter(function (x) { return x.code === code; })[0]; if (l && l.qty + 1 > p.qty) { toast('Only ' + p.qty + ' in stock', true); buzz(); } else if (l) { l.qty++; render(); } } break;
    case 'bill-dec': { var l2 = S.bill.filter(function (x) { return x.code === code; })[0]; if (l2) { l2.qty--; if (l2.qty < 1) S.bill = S.bill.filter(function (x) { return x !== l2; }); render(); } break; }
    case 'bill-rm': S.bill = S.bill.filter(function (x) { return x.code !== code; }); render(); break;
    case 'clear-bill': if (confirm('Clear this bill?')) { S.bill = []; S.discount = 0; render(); } break;
    case 'complete': completeBill(); break;
    case 'share': { var s = S.sales.filter(function (x) { return x.id === t.dataset.id; })[0]; if (s) shareText(receiptText(s)); break; }
    case 'open-bill': { var b = S.sales.filter(function (x) { return x.id === t.dataset.id; })[0]; if (b) showReceipt(b, []); break; }
    case 'addstock': p = findP(code); if (p) { closeModal(); addStockModal(p); } break;
    case 'do-addstock': case 'do-addstock-next': {
      p = findP(code); if (!p) return;
      var k = Math.floor(num('#fAdd'));
      if (!(k >= 1)) return toast('Enter a quantity of 1 or more', true);
      p.qty += k;
      if (!saveDb()) { p.qty -= k; return; }
      closeModal(); render(); toast('Added ' + k + ' · ' + p.name + ' now ' + p.qty);
      if (a === 'do-addstock-next') setTimeout(function () { doScan(handleStockCode); }, 250);
      break; }
    case 'edit-product': p = findP(code); if (p) productForm(code, p); break;
    case 'save-product': saveProduct(t.dataset['new'] === '1'); break;
    case 'del-product': if (confirm('Delete this product from stock?')) { var snap = S.db.products.slice(); S.db.products = S.db.products.filter(function (x) { return x.barcode !== code; }); S.bill = S.bill.filter(function (x) { return x.code !== code; }); if (!saveDb()) { S.db.products = snap; return; } closeModal(); render(); toast('Deleted'); } break;
    case 'save-settings': {
      var low = Math.floor(num('#sLow'));
      if (!(low >= 0)) return toast('Alert limit must be 0 or more', true);
      S.db.shop = $('#sShop').value.trim() || 'My Shop'; S.db.low = low; S.db.autoAdd = $('#sAuto').checked;
      if (saveDb()) { render(); toast('Settings saved'); }
      break; }
    case 'export': exportCsv(); break;
    case 'change-folder': if (A) A.pickFolder(); break;
    case 'reload': loadAll(); if (S.err) showError(); else { S.bill = []; render(); toast('Reloaded from folder'); } break;
  }
});
document.addEventListener('submit', function (e) {
  var f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  var inp = f.querySelector('input'), v = inp.value.trim(); inp.value = '';
  if (!v) return;
  if (f.dataset.form === 'sell-code') handleSellCode(v); else handleStockCode(v);
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'search') { S.q = e.target.value; $('#stockList').innerHTML = stockRows(); }
  if (e.target.id === 'discount') { S.discount = e.target.value; updateTotals(); }
});
window.handleBack = function () {
  if ($('#modal').classList.contains('open')) { closeModal(); return true; }
  if (S.tab !== 'sell') { S.tab = 'sell'; render(); return true; }
  return false;
};

/* ---------------- start ---------------- */
function full(html) { var f = $('#full'); f.innerHTML = html; f.style.display = html ? 'flex' : 'none'; }
function showSetup() {
  full('<h2>Choose a data folder</h2><p>Stock and bills are saved as files in a folder on this phone. No internet and no database.<br><br>Make or pick a folder such as <b>Documents / StockData</b>, then tap <b>Use this folder</b> on the next screen.</p><button class="big" id="pickBtn">Choose folder</button>');
  $('#pickBtn').onclick = function () { A.pickFolder(); };
}
function showError() {
  full('<h2>Could not read your data</h2><p>' + esc(S.err) + '</p><button class="big" id="retryBtn">Try again</button><button class="btn ghost" id="folderBtn">Choose another folder</button>');
  $('#retryBtn').onclick = boot;
  $('#folderBtn').onclick = function () { if (A) A.pickFolder(); };
}
window.onFolderChosen = function (ok) { if (ok) boot(); };
function boot() {
  full('');
  if (A && !A.hasFolder()) { showSetup(); return; }
  loadAll();
  if (S.err) { showError(); return; }
  S.folder = A ? A.folderName() : '';
  $('#dot').className = 'dot';
  if (!A) $('#demo').style.display = 'block';
  render();
  var n = lowList().length;
  if (n) { toast(n + ' product' + (n > 1 ? 's' : '') + ' low or out of stock', true); buzz(); }
}
boot();
})();
</script>
</body>
</html>
